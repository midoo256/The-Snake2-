<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

    <defs>

        <radialGradient id="bg" cx="50%" cy="45%" r="70%">
            <stop offset="0%" stop-color="#181818"/>
            <stop offset="65%" stop-color="#070707"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>

        <linearGradient id="snake" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b6ff00"/>
            <stop offset="45%" stop-color="#39ff14"/>
            <stop offset="100%" stop-color="#00a83b"/>
        </linearGradient>

        <linearGradient id="bomb" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff334f"/>
            <stop offset="55%" stop-color="#8b001f"/>
            <stop offset="100%" stop-color="#160008"/>
        </linearGradient>

        <filter id="greenGlow">
            <feGaussianBlur stdDeviation="12" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="redGlow">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>


    <!-- BACKGROUND -->

    <rect
        width="512"
        height="512"
        rx="110"
        fill="url(#bg)"
    />

    <circle
        cx="256"
        cy="256"
        r="210"
        fill="none"
        stroke="#252525"
        stroke-width="8"
    />


    <!-- RED DANGER RING -->

    <circle
        cx="256"
        cy="256"
        r="190"
        fill="none"
        stroke="#ff1744"
        stroke-width="3"
        opacity="0.35"
        filter="url(#redGlow)"
    />


    <!-- SPECIAL BOMB -->

    <circle
        cx="360"
        cy="365"
        r="70"
        fill="#ff003c"
        opacity="0.18"
        filter="url(#redGlow)"
    />

    <circle
        cx="360"
        cy="365"
        r="52"
        fill="url(#bomb)"
        stroke="#ff1744"
        stroke-width="5"
    />

    <!-- Bomb warning -->

    <path
        d="M360 335 L385 380 L335 380 Z"
        fill="#ffcc00"
        stroke="#fff176"
        stroke-width="3"
    />

    <text
        x="360"
        y="372"
        text-anchor="middle"
        font-family="Arial"
        font-size="35"
        font-weight="900"
        fill="#160000"
    >!</text>


    <!-- SNAKE GLOW -->

    <path
        d="
        M125 340
        C82 295 88 225 135 182
        C180 141 248 132 300 153
        C355 175 380 225 360 272
        C342 315 292 333 245 315
        C205 300 185 265 197 232
        C209 199 247 183 279 197
        C307 209 319 236 310 260
        "
        fill="none"
        stroke="#39ff14"
        stroke-width="68"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.25"
        filter="url(#greenGlow)"
    />


    <!-- MAIN SNAKE -->

    <path
        d="
        M125 340
        C82 295 88 225 135 182
        C180 141 248 132 300 153
        C355 175 380 225 360 272
        C342 315 292 333 245 315
        C205 300 185 265 197 232
        C209 199 247 183 279 197
        C307 209 319 236 310 260
        "
        fill="none"
        stroke="url(#snake)"
        stroke-width="55"
        stroke-linecap="round"
        stroke-linejoin="round"
    />


    <!-- SNAKE HEAD -->

    <circle
        cx="310"
        cy="260"
        r="39"
        fill="#39ff14"
        stroke="#b6ff00"
        stroke-width="5"
    />


    <!-- EYES -->

    <circle
        cx="298"
        cy="247"
        r="8"
        fill="#050505"
    />

    <circle
        cx="320"
        cy="253"
        r="8"
        fill="#050505"
    />

    <circle
        cx="296"
        cy="244"
        r="2.5"
        fill="white"
    />

    <circle
        cx="318"
        cy="250"
        r="2.5"
        fill="white"
    />


    <!-- SNAKE TONGUE -->

    <path
        d="M337 271 L362 280 M362 280 L374 271 M362 280 L376 287"
        fill="none"
        stroke="#ff1744"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
    />


    <!-- ENERGY PARTICLES -->

    <circle
        cx="120"
        cy="145"
        r="7"
        fill="#39ff14"
        opacity="0.8"
    />

    <circle
        cx="395"
        cy="145"
        r="5"
        fill="#ff1744"
        opacity="0.9"
    />

    <circle
        cx="105"
        cy="390"
        r="5"
        fill="#ff1744"
        opacity="0.8"
    />

    <circle
        cx="410"
        cy="300"
        r="6"
        fill="#39ff14"
        opacity="0.8"
    />


    <!-- GAME TITLE -->

    <text
        x="256"
        y="455"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="38"
        font-weight="900"
        letter-spacing="6"
        fill="#ffffff"
    >SNAKE</text>

    <text
        x="256"
        y="480"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
        letter-spacing="5"
        fill="#39ff14"
    >EXTREME</text>

</svg>