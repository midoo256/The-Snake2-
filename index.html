```html
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<meta
name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover"
>

<meta name="theme-color" content="#020202">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="The Snake">

<title>The Snake</title>

</head>

<body>

<!-- =================================
     MAIN MENU
     ================================= -->

<div id="mainMenu">

    <div class="menuBox">

        <div class="menuSnake">
            🐍
        </div>

        <div class="menuTitle">
            THE <span>SNAKE</span>
        </div>

        <div class="menuSubtitle">
            ARE YOU READY?
        </div>

        <button
            id="startGameBtn"
            class="menuButton"
            onclick="showDifficultyMenu()"
        >
            ▶ START GAME
        </button>


        <div
            id="difficultyMenu"
            class="difficultyMenu"
        >

            <div class="difficultyTitle">
                SELECT DIFFICULTY
            </div>

            <button
                class="difficultyButton easy"
                onclick="startSelectedDifficulty('easy')"
            >
                🟢 EASY
            </button>

            <button
                class="difficultyButton medium"
                onclick="startSelectedDifficulty('medium')"
            >
                🟡 MEDIUM
            </button>

            <button
                class="difficultyButton hard"
                onclick="startSelectedDifficulty('hard')"
            >
                🔴 HARD
            </button>

            <button
                class="difficultyButton extreme"
                onclick="startSelectedDifficulty('extreme')"
            >
                ☠️ EXTREME
            </button>

            <button
                class="backButton"
                onclick="hideDifficultyMenu()"
            >
                ← BACK
            </button>

        </div>

    </div>

</div>


<!-- =================================
     NAVBAR
     ================================= -->

<nav id="navbar">

<div class="logo">

    <div class="logoIcon">
        🐍
    </div>

    <div>
        The <span>Snake</span>
    </div>

</div>

<button
    id="fullscreenBtn"
    onclick="toggleFullscreen()"
>
    ⛶ Fullscreen
</button>

</nav>


<!-- =================================
     GAME
     ================================= -->

<div id="gameContainer">

<div id="topBar">

    <div class="scoreBox">

        <div class="label">
            Score
        </div>

        <div
            class="value"
            id="score"
        >
            0
        </div>

    </div>


    <div class="scoreBox">

        <div class="label">
            Best
        </div>

        <div
            class="value best"
            id="highScore"
        >
            0
        </div>

    </div>

</div>


<div id="heartsBox">

    <span class="heart" id="heart1">❤️</span>

    <span class="heart" id="heart2">❤️</span>

    <span class="heart" id="heart3">❤️</span>

</div>


<div id="lifeFeedback"></div>


<div id="deathHeartOverlay">

    <div id="deathHeart"></div>

    <div id="deathCrack"></div>

</div>


<div id="feedbackText"></div>


<canvas id="game"></canvas>


<div id="controls">
    WASD / ARROW KEYS • MOVE
</div>


<!-- =================================
     GAME OVER
     ================================= -->

<div id="gameOver">

    <div class="gameOverBox">

        <div class="gameOverIcon">
            💥
        </div>

        <div class="gameOverTitle">
            GAME OVER
        </div>

        <div class="finalScore">

            FINAL SCORE

            <span id="finalScore">
                0
            </span>

        </div>

        <button
            class="playAgain"
            onclick="restartGame()"
        >
            PLAY AGAIN
        </button>

        <button
            class="mainMenuBtn"
            onclick="showMainMenu()"
        >
            🏠 MAIN MENU
        </button>

    </div>

</div>

</div>


<script src="script.js"></script>

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register(
            "./service-worker.js"
        )
        .then(() => {

            console.log(
                "The Snake PWA ready!"
            );

        })
        .catch(error => {

            console.error(
                "Service Worker error:",
                error
            );

        });

    });

}

</script>

</body>

</html>
```
